groups:
  - name: atlas-feature-canary
    interval: 1m
    rules:
      - record: atlas_canary:gpu_metric_family_count
        expr: count by(UUID) (count by(UUID,__name__) ({__name__=~"DCGM_FI_DEV_.+",UUID!="",host_ip="10.114.4.101"}))
        labels:
          canary_scope: "10.114.4.101"
          owner: atlas-health
      - record: atlas_canary:gpu_metric_family_count_delta_5m
        expr: max_over_time(atlas_canary:gpu_metric_family_count{canary_scope="10.114.4.101"}[5m]) - min_over_time(atlas_canary:gpu_metric_family_count{canary_scope="10.114.4.101"}[5m])
        labels:
          canary_scope: "10.114.4.101"
          owner: atlas-health
