gateway:
  port: ":7077"
  ingestion_source_mode: "local-live"
  ingestion_stale_after: "15m"
storage:
  driver: "postgres"
  dsn: ""
branding:
  instance_name: "算力小镇-智元"
  product_name: "ATLAS"
  product_tagline: "HARDWARE RELIABILITY"
  environment: "DEVELOPMENT / 7077"
logging:
  dir: "/ops/atlas/logs"
web:
  static_dir: "/ops/atlas/web/dist"
prometheus:
  # The client appends /api/v1/query; do not put the complete query URL here.
  base_url: "http://10.80.192.236:28481/select/0/prometheus"
  request_timeout: "15s"
inventory:
  # VM select does not implement /api/v1/targets; Atlas falls back to the
  # standard up{} query to build this read-only target matrix.
  enabled: true
  asset_file: ""
  target_sync_interval: "10m"
  identity_sync_interval: "10m"
  full_sync_interval: "24h"
  history_window: "365d"
  expected_gpu_count: 8
  node_prefix: "10.80."
  bmc_from_host_label: true
  bmc_last_octet_min: 20
  target_jobs:
    - dcgm_exporter
    - gpu_exporter
    - node_exporter
    - ipmi_exporter
health:
  enabled: true
  score_interval: "10m"
  rule_version: "gpu-health-v1.6.0"
  history_retention: "365d"
history:
  enabled: true
  audit_interval: "6h"
  request_timeout: "60s"
  dataset_dir: "/ops/atlas/training"
  max_concurrency: 1
  sources:
    - id: "xiaozhen-zhiyuan-vm"
      name: "算力小镇-智元 VictoriaMetrics"
      type: "victoriametrics-cluster"
      base_url: "http://10.80.192.236:28481"
      tenant_id: "0"
      # This cluster does not serve /api/v1/status/flags, so the audit lookback
      # must be declared here. 180d is the window required to cover the oldest
      # repair-ledger fault window (2026-07-08) with headroom; GPU telemetry in
      # the VM store itself starts at 2026-06-30 and the probe stops there.
      retention: "180d"
      enabled: true
node_access:
  # 10.80.16.42 is a future physical-disk test node, not a synthetic GPU asset.
  enabled: false
  known_hosts_file: "/root/.ssh/known_hosts"
  max_concurrent_nodes: 1
  credential_profiles: []
feishu:
  bots: []
