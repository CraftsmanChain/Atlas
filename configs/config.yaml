gateway:
  port: ":7077"
  ingestion_source_mode: "local-live"
  ingestion_stale_after: "15m"
storage:
  driver: "postgres"
  # 生产 DSN 通过 ATLAS_DATABASE_DSN 注入，禁止在仓库保存密码。
  dsn: ""
branding:
  instance_name: "智元集群"
  product_name: "ATLAS"
  product_tagline: "GPU RELIABILITY"
  environment: "PRODUCTION / 7077"
prometheus:
  base_url: "http://10.111.201.1:9090"
  request_timeout: "20s"
inventory:
  enabled: true
  asset_file: "/ops/atlas/asset-monitor-compare.csv"
  target_sync_interval: "10m"
  identity_sync_interval: "10m"
  full_sync_interval: "24h"
  history_window: "365d"
  expected_gpu_count: 8
  node_prefix: "10.114.4."
  bmc_prefix: "10.114.1."
  bmc_last_octet_min: 20
  target_jobs:
    - dcgm_exporter
    - gpu_exporter
    - node_exporter
    - ipmi_exporter
health:
  enabled: true
  score_interval: "10m"
  rule_version: "gpu-health-v1.6.0"
  # 预测训练需要跨故障周期的历史；在线库先保留一年，后续再增加 Parquet 冷归档。
  history_retention: "365d"
history:
  enabled: true
  audit_interval: "6h"
  request_timeout: "60s"
  # 历史回填与训练在 Atlas/Prometheus 所在节点本地执行，不复制全量原始库到开发机。
  dataset_dir: "/mnt/public/atlas/training"
  max_concurrency: 2
  sources:
    - id: "current-prometheus"
      name: "Current Cluster Prometheus"
      type: "prometheus"
      base_url: "http://127.0.0.1:9090"
      enabled: true
node_access:
  enabled: true
  skill_id: "atlas-node-evidence"
  skill_version: "v0.6.3"
  ssh_port: 22
  known_hosts_file: "/root/.ssh/known_hosts"
  connect_timeout: "5s"
  command_timeout: "10s"
  max_output_bytes: 1048576
  max_concurrent_nodes: 2
  max_commands_per_node: 6
  credential_profiles: []
feishu:
  bots:
    - enabled: false
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_WEBHOOK_URL"
      enable_signature: false
      secret: ""
