gateway:
  port: ":8080"
  ingestion_source_mode: "local-live"
  ingestion_stale_after: "15m"
storage:
  dsn: "atlas.db"
branding:
  instance_name: "Atlas Cluster"
  product_name: "ATLAS"
  product_tagline: "GPU RELIABILITY"
  environment: "LOCAL"
node_access:
  enabled: false
  skill_id: "atlas-node-evidence"
  skill_version: "v0.3.2"
  ssh_port: 22
  known_hosts_file: ""
  connect_timeout: "5s"
  command_timeout: "10s"
  max_output_bytes: 1048576
  max_concurrent_nodes: 2
  max_commands_per_node: 6
  credential_profiles: []
feishu:
  bots:
    - enabled: false
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_WEBHOOK_URL"
      enable_signature: false
      secret: ""
