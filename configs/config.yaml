gateway:
  port: ":7077"
  ingestion_source_mode: "local-live"
  ingestion_stale_after: "15m"
storage:
  driver: "postgres"
  # 生产 DSN 通过 ATLAS_DATABASE_DSN 注入，禁止在仓库保存密码。
  dsn: ""
branding:
  instance_name: "智元集群"
  product_name: "ATLAS"
  product_tagline: "GPU RELIABILITY"
  environment: "PRODUCTION / 7077"
prometheus:
  base_url: "http://10.111.201.1:9090"
  request_timeout: "20s"
inventory:
  enabled: true
  asset_file: "/ops/atlas/asset-monitor-compare.csv"
  target_sync_interval: "10m"
  identity_sync_interval: "10m"
  full_sync_interval: "24h"
  history_window: "365d"
  expected_gpu_count: 8
  node_prefix: "10.114.4."
  bmc_prefix: "10.114.1."
  bmc_last_octet_min: 20
  target_jobs:
    - dcgm_exporter
    - gpu_exporter
    - node_exporter
    - ipmi_exporter
health:
  enabled: true
  score_interval: "10m"
  rule_version: "gpu-health-v1.4.1"
node_access:
  enabled: true
  skill_id: "atlas-node-evidence"
  skill_version: "v0.5.1"
  ssh_port: 22
  known_hosts_file: "/root/.ssh/known_hosts"
  connect_timeout: "5s"
  command_timeout: "10s"
  max_output_bytes: 1048576
  max_concurrent_nodes: 2
  max_commands_per_node: 6
  credential_profiles: []
feishu:
  bots:
    - enabled: false
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_WEBHOOK_URL"
      enable_signature: false
      secret: ""
