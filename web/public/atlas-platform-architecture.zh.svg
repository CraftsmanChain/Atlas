<rect x="40" y="930" width="1120" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="58" y="960" font-size="18" font-weight="600" fill="#475569">共同边界：来源与证据可追溯 · 未知不补零 · 人工确认关键操作</text>
<text x="58" y="989" font-size="15" font-weight="400" fill="#475569">相对风险不等于故障概率；研究与影子输出不自动触发隔离或重启。</text>
<path d="M48 1034 H90" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="104" y="1040" font-size="14" font-weight="400" fill="#475569">证据 / 数据流</text>
<path d="M360 1034 H402" stroke="#9333ea" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#research-arrow)"/>
<text x="416" y="1040" font-size="14" font-weight="400" fill="#475569">受门禁控制的研究路径</text>
</svg>
