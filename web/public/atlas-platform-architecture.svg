<text x="72" y="229" font-size="15" font-weight="400" fill="#475569">Node identity &amp; lifecycle</text>
</g>
<g id="telemetry"><rect x="428" y="154" width="344" height="94" rx="8" fill="#ffffff" stroke="#d1d5db"/>
