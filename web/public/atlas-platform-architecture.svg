<text x="816" y="629" font-size="15" font-weight="400" fill="#475569">Under development</text>
</g>
</g>
<g id="workspace"><rect x="40" y="708" width="1120" height="156" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="58" y="738" font-size="16" font-weight="700" fill="#475569">04  WORKSPACE</text>
<g id="product"><rect x="56" y="754" width="344" height="94" rx="8" fill="#ffffff" stroke="#d1d5db"/>
