<text x="72" y="429" font-size="15" font-weight="400" fill="#475569">Explicit missing or conflicting data</text>
</g>
<g id="history"><rect x="428" y="354" width="344" height="94" rx="8" fill="#ffffff" stroke="#d1d5db"/>
