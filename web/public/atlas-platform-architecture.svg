<text x="72" y="829" font-size="15" font-weight="400" fill="#475569">Chinese / English UI · configuration</text>
</g>
<g id="workflow"><rect x="428" y="754" width="344" height="94" rx="8" fill="#ffffff" stroke="#d1d5db"/>
