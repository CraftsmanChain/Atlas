<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc" lang="en">
<title id="title">ATLAS Platform Architecture</title>
<desc id="desc">Evidence sources, data foundation, assessment, workspace and gated offline research.</desc>
<style>text {font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#2563eb"/></marker><marker id="research-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#9333ea"/></marker></defs>
<rect width="1200" height="930" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="700" fill="#111827">ATLAS · Infrastructure Hardware Reliability</text>
<text x="40" y="76" font-size="17" font-weight="400" fill="#475569">Traceable evidence informs assessment; people control consequential actions</text>
<g id="sources"><rect x="40" y="108" width="1120" height="156" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="58" y="138" font-size="16" font-weight="700" fill="#475569">01  SOURCES</text>
