<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS Platform Architecture</title>
  <desc id="desc">Architecture from authoritative assets and telemetry through data foundation, reliability engines, AI-assisted reports and repair validation.</desc>
  <style>
    text { font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif; }
    .title { fill:#111827;font-size:24px;font-weight:700; }
    .subtitle { fill:#6b7280;font-size:13px; }
    .layer { fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:7 5; }
    .layer-label { fill:#475569;font-size:11px;font-weight:700;letter-spacing:.11em; }
    .node-title { fill:#111827;font-size:14px;font-weight:650; }
    .node-sub { fill:#64748b;font-size:11px; }
    .version { fill:#2563eb;font-size:10px;font-weight:700; }
    .arrow-label { fill:#475569;font-size:10px;font-weight:600; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="42" y="39" class="title">ATLAS · Infrastructure Hardware Reliability Workbench</text>
  <text x="42" y="61" class="subtitle">Authoritative assets → monitoring evidence → deterministic decisions → prediction → AI-assisted operations → repair validation</text>

  <rect x="32" y="82" width="1136" height="122" rx="10" class="layer"/>
  <text x="50" y="103" class="layer-label">SOURCE &amp; EVIDENCE</text>
  <g filter="url(#shadow)">
    <rect x="58" y="119" width="245" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="87" cy="143" r="13" fill="#2563eb"/><text x="87" y="147" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">A</text>
    <text x="109" y="143" class="node-title">LXOPEasier</text><text x="109" y="161" class="node-sub">资产事实来源 · 机房 / 机柜 / 设备</text>
    <rect x="335" y="119" width="245" height="66" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="364" cy="143" r="13" fill="#e6522c"/><text x="364" y="147" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">PM</text>
    <text x="386" y="143" class="node-title">Prometheus · DCGM</text><text x="386" y="161" class="node-sub">GPU / Node / Target / 时序指标</text>
    <rect x="612" y="119" width="245" height="66" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="641" cy="143" r="13" fill="#0f766e"/><text x="641" y="147" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">HW</text>
    <text x="663" y="143" class="node-title">Logs · BMC / IPMI</text><text x="663" y="161" class="node-sub">XID / AER / SEL / PSU / Thermal</text>
    <rect x="889" y="119" width="245" height="66" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="918" cy="143" r="13" fill="#7c3aed"/><text x="918" y="147" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">FB</text>
    <text x="940" y="143" class="node-title">人工维修反馈</text><text x="940" y="161" class="node-sub">处置 / 根因 / 更换 / 复测标签</text>
  </g>

  <rect x="32" y="220" width="1136" height="126" rx="10" class="layer"/>
  <text x="50" y="241" class="layer-label">DATA FOUNDATION</text>
  <path d="M180 185 V224 H208 V254" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M458 185 V224 H500 V254" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M735 185 V224 H792 V254" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M1012 185 V216 H1044 V254" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">
    <rect x="78" y="258" width="260" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="96" y="280" class="version">ASSET · v0.2.0</text><text x="96" y="301" class="node-title">资产同步与对账</text><text x="96" y="317" class="node-sub">事实资产 × 实际观测 × 生命周期</text>
    <rect x="370" y="258" width="260" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="388" y="280" class="version">QUALITY · v0.2.0</text><text x="388" y="301" class="node-title">监控数据质量发现</text><text x="388" y="317" class="node-sub">覆盖 / 缺失 / 陈旧 / 冲突 / 抑制</text>
    <rect x="662" y="258" width="260" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="680" y="280" class="version">NORMALIZE</text><text x="680" y="301" class="node-title">事件与特征标准化</text><text x="680" y="317" class="node-sub">identity / metric / event / feature</text>
    <rect x="954" y="258" width="180" height="68" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="972" y="280" class="version">LABELS</text><text x="972" y="301" class="node-title">故障标签库</text><text x="972" y="317" class="node-sub">confirmed / cause</text>
  </g>

  <rect x="32" y="376" width="1136" height="138" rx="10" class="layer"/>
  <text x="50" y="397" class="layer-label">RELIABILITY ENGINES</text>
  <path d="M208 326 V360 H180 V412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M500 326 V360 H458 V412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M792 326 V352 H735 V412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M1044 326 V360 H805 V412" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">
    <rect x="58" y="416" width="245" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="76" y="439" class="version">HEALTH · v1.0.0</text><text x="76" y="461" class="node-title">硬件健康评分</text><text x="76" y="478" class="node-sub">六领域规则 · 数据置信度</text>
    <rect x="335" y="416" width="245" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="353" y="439" class="version">DETECTION · v0.1.0</text><text x="353" y="461" class="node-title">故障检测</text><text x="353" y="478" class="node-sub">已发生 / 正在发生的硬件故障</text>
    <rect x="612" y="416" width="245" height="76" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="630" y="439" class="version">PREDICTION · v0.0.0</text><text x="630" y="461" class="node-title">故障预警与预测</text><text x="630" y="478" class="node-sub">GPU + 服务器 / 存储 / 网络硬件</text>
    <rect x="889" y="416" width="245" height="76" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="907" y="439" class="version">DEGRADATION · v0.0.0</text><text x="907" y="461" class="node-title">性能衰减识别</text><text x="907" y="478" class="node-sub">被动检测 · 维护窗口主动验证</text>
  </g>

  <rect x="32" y="550" width="1136" height="154" rx="10" class="layer"/>
  <text x="50" y="571" class="layer-label">OPERATIONS &amp; CLOSED LOOP</text>
  <path d="M180 492 V542 H208 V594" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M458 492 V530 H500 V594" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M735 492 V538 H792 V594" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <path d="M1012 492 V530 H1044 V594" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="78" y="598" width="260" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="96" y="621" class="version">INCIDENT · v0.1.0</text><text x="96" y="643" class="node-title">故障事件管理</text><text x="96" y="660" class="node-sub">episode · case · workflow</text>
    <rect x="370" y="598" width="260" height="78" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="2.2"/>
    <rect x="374" y="602" width="252" height="70" rx="8" fill="none" stroke="#ddd6fe" stroke-width=".8"/>
    <text x="388" y="621" class="version">AI + SKILL · PATH DEFINED</text><text x="388" y="643" class="node-title">故障报告与处理建议</text><text x="388" y="660" class="node-sub">辅助归因 / SOP / 证据解释 · 未开发</text>
    <rect x="662" y="598" width="260" height="78" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="680" y="621" class="version">VALIDATION · v0.0.0</text><text x="680" y="643" class="node-title">维修验证闭环</text><text x="680" y="660" class="node-sub">反馈 / 根因 / 修复 / 更换 / 复测</text>
    <rect x="954" y="598" width="180" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="972" y="621" class="version">ATLAS API / UI</text><text x="972" y="643" class="node-title">工作台输出</text><text x="972" y="660" class="node-sub">详情 · 状态 · 历史</text>
  </g>
  <path d="M338 637 H365" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <path d="M630 637 H657" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <path d="M922 637 H949" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <g transform="translate(48 734)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="44" y="12" class="subtitle">数据采集 / 同步</text>
    <line x1="190" y1="8" x2="224" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="234" y="12" class="subtitle">主决策与工作流</text>
    <line x1="410" y1="8" x2="444" y2="8" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/><text x="454" y="12" class="subtitle">反馈 / AI 辅助 / 标签闭环</text>
    <text x="1138" y="12" text-anchor="end" class="subtitle">高风险动作始终需要人工确认</text>
  </g>
</svg>
